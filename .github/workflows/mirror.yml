name: Mirror to Hugging Face and Kaggle

# Keeps the dataset mirrors in sync with this repository:
#   https://huggingface.co/datasets/raspberry-tips/raspberry-pi-imager-os-download-shares
#   https://www.kaggle.com/datasets/philippschweizer/raspberry-pi-imager-os-download-shares
# data/ changes weekly; mirroring monthly is enough. Runs the day after the
# monthly Zenodo release and only uploads if a mirror is older than data/.
# (A release created with GITHUB_TOKEN does not trigger other workflows,
# so this cannot listen to the release event.)

on:
  schedule:
    - cron: '0 7 2 * *' # 2nd of each month, 07:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Upload even if the mirrors look up to date'
        type: boolean
        default: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sync.py compares the last commit touching data/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install huggingface_hub kaggle

      - name: Sync mirrors
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python .mirror/sync.py --live
          else
            python .mirror/sync.py --live --if-stale
          fi
